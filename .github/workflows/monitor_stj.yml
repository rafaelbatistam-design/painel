name: Monitor STJ
on:
  # toda segunda-feira, 07:00 de Brasília (10:00 UTC)
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      modo:
        description: 'semanal (só novidades) ou completo (revisão de 12 meses)'
        default: 'semanal'
permissions:
  contents: write
  actions: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar processos e gerar a página
        env:
          # chave pública do DataJud, divulgada pelo CNJ para todos os usuários
          # (https://datajud-wiki.cnj.jus.br/api-publica/acesso). Se houver segredo próprio, ele tem preferência.
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY || 'cDZHYzlZa0JadVREZDJCendQbXY6SkJlTzNjLV9TRENyQk1RdnFKZGRQdw==' }}
        run: |
          # revisão completa na primeira segunda-feira do mês; nas demais, só as novidades
          MODO="${{ github.event.inputs.modo }}"
          if [ -z "$MODO" ]; then
            if [ "$(date +%d)" -le 7 ]; then MODO=completo; else MODO=semanal; fi
          fi
          export MODO
          python scripts/coletar_stj.py
      - name: Gravar e republicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stj/
          if git diff --staged --quiet; then echo "Sem mudanças."; else
            git commit -m "Monitor STJ: atualização $(date +'%d/%m/%Y %H:%M')"
            git pull --rebase origin main
            git push
            gh workflow run publicar.yml --ref main
          fi
