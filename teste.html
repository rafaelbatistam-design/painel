<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquez Advogados (teste)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --paper:#efeee9;--paper2:#e7e5de;--surface:#fff;
  --ink:#1b2a4a;--ink2:#263a63;--ink-soft:#3a4a6b;
  --text:#1e2b47;--muted:#647089;--faint:#98a1b4;
  --line:rgba(27,42,74,.09);--line2:rgba(27,42,74,.18);
  --red:#c0322b;--red-bg:#fbeceb;--red-b:#f2c4c0;
  --ora:#b45309;--ora-bg:#fdf3e3;--ora-b:#f2d9a8;
  --grn:#15803d;--grn-bg:#eaf6ee;--grn-b:#bbe3c6;
  --blu:#1d4ed8;--blu-bg:#e8eefc;--blu-b:#bcccf5;
  --car:#3b5ea6;--car-bg:#e9eef8;--car-b:#bccbe9;
  --amb:#92400e;
  --jud:#a01a12;--jud-bg:#f7e4e2;--jud-b:#e6b4ae;
  --r:7px;--rl:11px;--rx:16px;
  --sh:0 1px 2px rgba(27,42,74,.05);
  --sh2:0 6px 22px rgba(27,42,74,.13);
}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--text);font-size:13.5px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:var(--blu);text-decoration:none;}a:hover{text-decoration:underline;}
.mono{font-family:'DM Mono',monospace;font-feature-settings:"tnum";letter-spacing:-.2px;}
::-webkit-scrollbar{width:9px;height:9px;}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;}::-webkit-scrollbar-track{background:transparent;}

/* ── UPDATE BAR ─────────────────────────────── */
#ubar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--ink);box-shadow:0 1px 14px rgba(0,0,0,.28);}
#utoggle{width:100%;padding:8px 18px;background:transparent;border:none;color:#fff;font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px;}
#utoggle:hover{background:var(--ink2);}
#upanel{padding:10px 18px 14px;border-top:1px solid rgba(255,255,255,.1);display:none;}
#ucmd{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:var(--r);color:#fff;font-family:'DM Mono',monospace;font-size:12px;padding:11px 13px;resize:vertical;min-height:78px;outline:none;line-height:1.6;}
#ucmd::placeholder{color:rgba(255,255,255,.34);}
#ucmd:focus{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.11);}
#uactions{display:flex;gap:8px;margin-top:8px;align-items:center;}
#ufeedback{font-size:11px;color:#8fe3a8;flex:1;}
.btn-apply{padding:8px 20px;background:#fff;color:var(--ink);border:none;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.btn-apply:hover{background:#dbe3ef;}
.btn-uhelp{padding:8px 11px;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:var(--r);color:rgba(255,255,255,.68);font-family:inherit;font-size:11px;cursor:pointer;}
.btn-uhelp:hover{border-color:rgba(255,255,255,.4);color:#fff;}

/* ── MODAIS ─────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(20,28,48,.5);backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal-box{background:var(--surface);border-radius:var(--rx);padding:22px 24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh2);}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-hdr h3{font-size:15px;font-weight:600;}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;}
.modal-close:hover{color:var(--ink);}

/* ── SHELL ──────────────────────────────────── */
#app{max-width:1440px;margin:0 auto;padding:16px 22px 40px;}
#hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
#hdr h1{font-size:19px;font-weight:600;letter-spacing:-.3px;}
#hdr .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
#hdr-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
#sync-badge{font-size:11px;color:var(--faint);margin-right:2px;}
.hdr-btn{padding:7px 12px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11.5px;cursor:pointer;color:var(--ink-soft);font-weight:500;box-shadow:var(--sh);}
.hdr-btn:hover{background:var(--paper2);}
.alert-pill{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;}
.pill-red{background:var(--jud-bg);color:var(--jud);border:1px solid var(--jud-b);}
.pill-grn{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-b);}

/* ── TABS ───────────────────────────────────── */
#tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto;align-items:center;}
.tab{padding:11px 19px;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px;}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
.tab .cnt{font-size:10.5px;background:var(--paper2);color:var(--muted);border-radius:9px;padding:0 6px;font-weight:600;line-height:16px;}
.tab.on .cnt{background:var(--ink);color:#fff;}
.tab-home{font-size:16.5px;font-weight:800;color:var(--ink);padding-left:2px;}
.tab-home:hover{color:var(--ink);opacity:.85;}
.tab-home.on{border-bottom-color:var(--ink);}

/* ── METRICS ────────────────────────────────── */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px;}
.met{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:13px 15px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s,box-shadow .12s;}
.met:hover{transform:translateY(-1px);box-shadow:var(--sh2);}
.met-lbl{font-size:11px;color:var(--muted);font-weight:500;}
.met-val{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.5px;}
.met-val .of{font-size:11px;font-weight:400;color:var(--faint);margin-left:4px;letter-spacing:0;}
.met-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.met.accent-ora{border-top:2px solid var(--ora);}
.met.accent-blu{border-top:2px solid var(--blu);}

.sec-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-hint{font-size:10.5px;color:var(--faint);font-weight:400;}

/* ── PRAZO JUDICIAL · carimbo ───────────────── */
.jud-stamp{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.7px;color:var(--jud);background:var(--jud-bg);border:1px solid var(--jud-b);padding:2px 7px;border-radius:4px;text-transform:uppercase;}

/* ── DASHBOARD timeline ─────────────────────── */
.tl{display:flex;flex-direction:column;gap:6px;}
.tl-item{display:flex;gap:12px;align-items:stretch;cursor:pointer;border-radius:var(--rl);padding:11px 14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);transition:box-shadow .13s,transform .13s;}
.tl-item:hover{box-shadow:var(--sh2);transform:translateY(-1px);}
.tl-jud{background:var(--jud-bg);border-color:var(--jud-b);border-left:4px solid var(--jud);}
.tl-overdue{background:var(--red-bg);border-color:var(--red-b);}
.tl-urgent{background:var(--ora-bg);border-color:var(--ora-b);}
.tl-honor{background:#fbfbf9;}
.tl-bar{width:7px;min-width:7px;border-radius:4px;margin:1px 0;background:var(--line2);}
.tl-jud .tl-bar{background:var(--jud);}.tl-overdue .tl-bar{background:var(--red);}.tl-urgent .tl-bar{background:var(--ora);}.tl-near .tl-bar{background:var(--blu);}.tl-honor .tl-bar{background:var(--grn);}
.tl-c{flex:1;min-width:0;}
.tl-lbl{font-size:10px;font-weight:600;letter-spacing:.3px;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.tl-jud .tl-lbl{color:var(--jud);}.tl-overdue .tl-lbl{color:var(--red);}.tl-urgent .tl-lbl{color:var(--ora);}.tl-near .tl-lbl{color:var(--blu);}.tl-honor .tl-lbl{color:var(--grn);}
.tl-main{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-sub{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;flex-shrink:0;}
.tl-days{font-size:19px;font-weight:700;line-height:1;letter-spacing:-.5px;}
.tl-jud .tl-days,.tl-overdue .tl-days{color:var(--red);}.tl-urgent .tl-days{color:var(--ora);}.tl-near .tl-days{color:var(--blu);}.tl-honor .tl-days{color:var(--grn);}
.mini-cal{font-size:10px;background:var(--surface);border:1px solid var(--line2);border-radius:5px;padding:2px 7px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap;}
.mini-cal:hover{background:var(--blu-bg);border-color:var(--blu-b);color:var(--blu);}

.pje-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pje-a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:11px 14px;box-shadow:var(--sh);}
.pje-a:hover{border-color:var(--ink);text-decoration:none;}
.pje-a h4{font-size:12px;font-weight:600;color:var(--ink);}
.pje-a p{font-size:10.5px;color:var(--blu);margin-top:2px;}

/* ── MASTER-DETAIL ──────────────────────────── */
.md{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.md-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden;position:sticky;top:70px;max-height:calc(100vh - 88px);display:flex;flex-direction:column;}
.md-search{padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
.md-search input{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12.5px;outline:none;background:var(--paper);}
.md-search input:focus{border-color:var(--ink);background:#fff;}
.md-rows{overflow-y:auto;flex:1;}
.md-group-h{font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.4px;padding:9px 14px 4px;text-transform:uppercase;position:sticky;top:0;background:var(--surface);z-index:1;}
.md-row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;transition:background .1s;}
.md-row:hover{background:var(--paper);}
.md-row.sel{background:var(--blu-bg);box-shadow:inset 3px 0 0 var(--ink);}
.md-row-bar{width:4px;align-self:stretch;border-radius:3px;background:transparent;flex-shrink:0;margin:-2px 0;}
.md-row.has-jud .md-row-bar{background:var(--jud);}
.md-row-c{flex:1;min-width:0;}
.md-row-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.md-row-meta{font-size:10.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.md-row-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.md-row-days{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;}
.dd-jud{background:var(--jud-bg);color:var(--jud);border:1px solid var(--jud-b);}
.dd-over{background:var(--red-bg);color:var(--red);}
.dd-urg{background:var(--ora-bg);color:var(--ora);}
.dd-ok{background:var(--paper2);color:var(--muted);}
.md-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* detail pane */
.md-detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);min-height:400px;}
.dt-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);}
.dt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.dt-name{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.2;}
.dt-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.dt-meta .mono{font-size:11px;}
.dt-actions{display:flex;gap:6px;flex-shrink:0;}
.dt-body{padding:16px 20px 22px;}
.dt-sec{margin-bottom:22px;}
.dt-sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.dt-sec-h h4{font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
.dt-sec-h h4 .n{font-size:10.5px;color:var(--muted);background:var(--paper2);border-radius:9px;padding:0 6px;font-weight:600;}

/* tarefa rows */
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:6px;background:var(--surface);transition:background .1s;}
.task.drag{cursor:grab;}
.task.dragging{opacity:.4;}
.task.t-jud{background:var(--jud-bg);border-color:var(--jud-b);border-left:3px solid var(--jud);}
.task.t-over{background:var(--red-bg);border-color:var(--red-b);}
.task.t-urg{background:var(--ora-bg);border-color:var(--ora-b);}
.task.t-fu{background:var(--car-bg);border-color:var(--car-b);}
.task-chk{width:17px;height:17px;margin-top:1px;cursor:pointer;accent-color:var(--grn);flex-shrink:0;}
.task.t-jud .task-chk{accent-color:var(--jud);}
.task-c{flex:1;min-width:0;}
.task-txt{font-size:12.5px;font-weight:500;line-height:1.4;}
.task-meta{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.task-date{font-weight:600;}
.task-date.over{color:var(--red);}.task-date.urg{color:var(--ora);}.task-date.jud{color:var(--jud);}
.task-x{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0 3px;flex-shrink:0;}
.task-x:hover{color:var(--red);}
.task-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.task-add input,.task-add select{padding:6px 9px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11.5px;outline:none;background:#fff;}
.task-add input:focus{border-color:var(--ink);}
.task-add .ta-txt{flex:1;min-width:130px;}

.hist-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;}
.hist-date{font-size:10.5px;color:var(--faint);font-weight:600;flex-shrink:0;width:66px;}
.hist-txt{flex:1;color:var(--ink-soft);}
.hist-add{display:flex;gap:6px;margin-top:8px;}
.hist-add input{flex:1;padding:6px 9px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:11.5px;outline:none;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.info-cell{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;}
.info-cell .k{font-size:9.5px;color:var(--faint);font-weight:600;letter-spacing:.3px;margin-bottom:2px;}
.info-cell .v{font-size:12px;font-weight:500;}
.summary-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;}

/* ── BUTTONS ────────────────────────────────── */
.btn{padding:8px 15px;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;}
.btn-pri{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-pri:hover{background:var(--ink2);}
.btn-ghost{background:var(--surface);color:var(--ink-soft);border-color:var(--line2);}
.btn-ghost:hover{background:var(--paper2);}
.btn-sm{padding:5px 11px;font-size:11px;}
.btn-new{padding:8px 15px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.btn-new:hover{background:var(--ink2);}
.iconbtn{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;cursor:pointer;font-size:12px;color:var(--muted);font-family:inherit;}
.iconbtn:hover{background:var(--paper2);color:var(--ink);}
.iconbtn.del:hover{color:var(--red);border-color:var(--red-b);}

/* ── TOP BAR / VIEW TOGGLE ──────────────────── */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.seg{display:inline-flex;background:var(--paper2);border-radius:var(--r);padding:2px;gap:2px;}
.seg button{padding:6px 13px;border:none;background:transparent;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:5px;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh);font-weight:600;}
.filters{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.fbtn{padding:6px 13px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);font-family:inherit;font-size:11.5px;cursor:pointer;color:var(--muted);}
.fbtn:hover{border-color:var(--ink);}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;}

/* ── KANBAN ─────────────────────────────────── */
.kb-scroll{overflow-x:auto;padding-bottom:10px;}
.kb{display:flex;gap:13px;min-width:min-content;}
.kb-col{width:270px;flex-shrink:0;}
.kb-col-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:7px 11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);border-left:3px solid var(--muted);}
.kb-col-h .t{font-size:11px;font-weight:600;letter-spacing:.2px;flex:1;}
.kb-col-h .c{font-size:11px;font-weight:600;color:var(--muted);background:var(--paper2);border-radius:10px;padding:0 8px;line-height:18px;}
.kb-drop{min-height:60px;border-radius:var(--rl);transition:background .12s;padding:2px;}
.kb-drop.over{background:var(--blu-bg);outline:2px dashed var(--blu-b);}
.kb-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:11px 13px;margin-bottom:7px;box-shadow:var(--sh);cursor:grab;border-left:3px solid transparent;transition:box-shadow .12s,transform .12s;}
.kb-card:hover{box-shadow:var(--sh2);}
.kb-card:active{cursor:grabbing;}
.kb-card.dragging{opacity:.45;transform:scale(.98);}
.kb-card.has-jud{border-left-color:var(--jud);}
.kb-card-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kb-card-meta{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kb-card-jud{margin-top:7px;}
.kb-card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;}

/* ── HONORÁRIOS (mantém base) ───────────────── */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:15px 17px;margin-bottom:11px;box-shadow:var(--sh);}
.hcard-name{font-size:14px;font-weight:600;}
.hdet{border:1px solid var(--line);border-radius:var(--rl);padding:13px;margin-bottom:8px;background:var(--paper);}
.hdet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.hdet-tipo{font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--ink);}
.hdet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
.hdet-field{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;}
.hdet-field-lbl{font-size:9px;color:var(--faint);letter-spacing:.3px;font-weight:600;margin-bottom:2px;}
.hdet-field-val{font-size:12px;font-weight:600;}
.hdet-field-val.grn{color:var(--grn);}.hdet-field-val.red{color:var(--red);}.hdet-field-val.ora{color:var(--ora);}

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}

// ══ SYNC ═══════════════════════════════════════════════
async function syncFromSheet(){
  setSt('syncing');renderBadge();
  try{
    const r=await fetch(SHEET_URL+'?secret='+SECRET+'&t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();if(d.error==='unauthorized'){pedirSenha('Senha incorreta. Digite novamente.');setSt('error');renderBadge();return;}if(d.error)throw new Error(d.error);_loadedOk=true;
    if(d.casos&&d.casos.length){
      S.casos=d.casos;
      if(d.prospeccao)S.prospeccao=d.prospeccao;
      if(d.linkedin)S.linkedin=d.linkedin;
      if(d.contabil)S.contabil=d.contabil;
      if(d.tags&&d.tags.length)S.tags=d.tags;else if(!S.tags||!S.tags.length)S.tags=SEED_TAGS;
      const ch=migrate();
      if(ch)saveData();else saveLocal();
    }
    setSt('ok');
  }catch(e){console.error(e);setSt('error');}
  renderBadge();render();
}
async function saveData(){
  saveLocal();
  if(!_loadedOk||!SECRET){setSt('error');renderBadge();showFb&&showFb('Não salvo: a planilha ainda não foi carregada. Clique em Sincronizar.',true);return;}setSt('syncing');renderBadge();
  const payload={secret:SECRET,casos:S.casos,prospeccao:S.prospeccao,linkedin:S.linkedin,contabil:S.contabil,tags:S.tags};
  try{
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({data:JSON.stringify(payload)})});
    // o POST é no-cors (não retorna status), então conferimos relendo a planilha
    let okSave=false;
    try{
      const r=await fetch(SHEET_URL+'?secret='+SECRET+'&t='+Date.now());
      const d=await r.json();
      okSave=d&&!d.error
        &&JSON.stringify(d.casos||[])===JSON.stringify(S.casos||[])
        &&JSON.stringify(d.prospeccao||[])===JSON.stringify(S.prospeccao||[]);
    }catch(_){okSave=false;}
    setSt(okSave?'ok':'error');
  }catch(e){setSt('error');}
  renderBadge();
}
function setSt(st){syncSt=st;if(st==='ok')lastSync=new Date();}
function renderBadge(){
  const txt={syncing:'⟳ Sincronizando…',ok:'✓ Sincronizado '+(lastSync?lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''),error:'⚠ Erro de sincronização',idle:''}[syncSt];

}

// ══ UTILS ══════════════════════════════════════════════
function uid(){return Math.random().toString(36).substr(2,9);}
function fDate(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('pt-BR');}catch{return d;}}
function fDateShort(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}catch{return d;}}
function fCur(v){return(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
function daysTo(d){if(!d)return null;return Math.round((new Date(d+'T00:00:00')-today0())/864e5);}
function gv(id){const e=document.getElementById(id);return e?e.value:'';}
function parseDate(v){if(/^\d{2}\/\d{2}\/\d{4}$/.test(v)){const[d,m,y]=v.split('/');return y+'-'+m+'-'+d;}return v;}

function sLabel(s){return{em_andamento:'Em andamento',aguardando:'Aguardando',encerrado:'Encerrado',liminar:'Liminar',recurso:'Recurso'}[s]||s||'Em andamento';}
function sBadge(s){return{em_andamento:'b-info',aguardando:'b-warn',encerrado:'b-success',liminar:'b-danger',recurso:'b-muted'}[s]||'b-muted';}

// tarefas helpers
function findItem(id){return S.casos.find(x=>x.id===id)||S.prospeccao.find(x=>x.id===id)||null;}
function pendTasks(c){return(c.tarefas||[]).filter(t=>!t.feito);}
function judTasks(c){return pendTasks(c).filter(t=>isJud(t.tipo)&&t.data);}
// menor data judicial pendente (data = data de contagem)
function nextPrazo(c){const j=judTasks(c).map(t=>t.data).filter(Boolean).sort();return j[0]||null;}
function hasPrazoUrg(c){const p=nextPrazo(c);if(!p)return false;const d=daysTo(p);return d!==null&&d<=7;}
// campo legado c.deadline foi aposentado · tudo vem das tarefas judiciais

function getPago(h){const p=h.parcelas||[];if(p.length>0)return p.filter(x=>x.pago).reduce((s,x)=>s+(x.valor||0),0);return h.pago||0;}
function getProximaParcelaAberta(h){const p=[...(h.parcelas||[])].sort((a,b)=>(a.vencimento||'zz').localeCompare(b.vencimento||'zz'));return p.find(x=>!x.pago)||null;}
function getAllProximasParcelas(dias){
  const now=new Date();const res=[];
  S.casos.forEach(c=>(c.honorarios||[]).forEach(h=>{
    const prox=getProximaParcelaAberta(h);
    if(prox&&prox.vencimento){const dl=daysTo(prox.vencimento);res.push({casoId:c.id,client:c.client,parcela:prox,honorarioId:h.id,tipo:h.tipo,dl});}
    else if(prox){res.push({casoId:c.id,client:c.client,parcela:prox,honorarioId:h.id,tipo:h.tipo,dl:null});}
  }));
  res.sort((a,b)=>a.dl===null?1:b.dl===null?-1:a.dl-b.dl);
  return res;
}

// sort casos: prazo judicial vencido → urgente → futuro → sem prazo → encerrado
function caseSortVal(c){
  if(c.status==='encerrado')return 1e9;
  const p=nextPrazo(c);if(!p)return 5e8;
  const d=daysTo(p);return d;
}
function sortC(l){return[...l].sort((a,b)=>{const av=caseSortVal(a),bv=caseSortVal(b);if(av!==bv)return av-bv;return a.client.localeCompare(b.client,'pt-BR');});}

function gcalLink(title,date,details){
  if(!date)return'';const d=date.replace(/-/g,'');
  const nx=new Date(date+'T12:00:00');nx.setDate(nx.getDate()+1);
  const end=nx.toISOString().slice(0,10).replace(/-/g,'');
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('[Escritório] '+title)+'&dates='+d+'/'+end+'&details='+encodeURIComponent(details||'');
}
// evento cobrindo a janela (abertura → fatal); se sem abertura, cai no dia fatal
function gcalWindow(title,inicio,fatal,details){
  if(!fatal)return'';
  if(!inicio)return gcalLink(title,fatal,details);
  const d=inicio.replace(/-/g,'');
  const nx=new Date(fatal+'T12:00:00');nx.setDate(nx.getDate()+1);
  const end=nx.toISOString().slice(0,10).replace(/-/g,'');
  const det=(details?details+' · ':'')+'Janela: '+fDate(inicio)+' até '+fDate(fatal)+' (data fatal)';
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('[Escritório] '+title)+'&dates='+d+'/'+end+'&details='+encodeURIComponent(det);
}

// ══ TAGS ═══════════════════════════════════════════════
function getTag(id){return S.tags.find(t=>t.id===id);}
function getColor(cid){return TAG_COLORS.find(c=>c.id===cid)||TAG_COLORS[8];}
function tagPill(tagId){
  const t=getTag(tagId);if(!t)return'';const col=getColor(t.color);const active=S.activeTagFilter===tagId;

}
function toggleTagFilter(id){S.activeTagFilter=S.activeTagFilter===id?null:id;render();}

// ══ UPDATE BAR ═════════════════════════════════════════
let uOpen=false;
function toggleU(){uOpen=!uOpen;document.getElementById('upanel').style.display=uOpen?'block':'none';document.getElementById('utoggle-lbl').textContent=uOpen?'Fechar':'Colar atualização do Claude';setTop();}
function setTop(){const h=document.getElementById('ubar').offsetHeight;document.getElementById('app').style.paddingTop=(h+16)+'px';}
function showFb(msg,err){const el=document.getElementById('ufeedback');el.textContent=msg;el.style.color=err?'#fca5a5':'#8fe3a8';setTimeout(()=>el.textContent='',4200);}
function applyUpdate(){
  const raw=document.getElementById('ucmd').value.trim();
  if(!raw.toUpperCase().startsWith('UPDATE')){showFb('Deve começar com UPDATE',true);return;}
  const lines=raw.split('\n').slice(1).map(l=>l.trim()).filter(l=>l&&l.includes('→'));
  let ok=0;const errs=[];
  for(const line of lines){
    const[sel,...rest]=line.split('→');const asgn=rest.join('→').trim();
    const ci=asgn.indexOf(':');if(ci<0)continue;
    const field=asgn.slice(0,ci).trim().toLowerCase(),value=asgn.slice(ci+1).trim();
    const slo=sel.trim().toLowerCase();
    if(slo.startsWith('caso:')){
      const q=slo.slice(5).trim();const c=S.casos.find(x=>x.client.toLowerCase().includes(q));
      if(!c){errs.push(q);continue;}applyC(c,field,value);ok++;
    }else if(slo.startsWith('prospecção:')||slo.startsWith('prospeccao:')){
      const q=slo.replace(/prospec[çc][aã]o:/,'').trim();const p=S.prospeccao.find(x=>x.name.toLowerCase().includes(q));
      if(!p){errs.push(q);continue;}applyP(p,field,value);ok++;
    }
  }
  if(ok>0){saveData();render();showFb(ok+' atualização'+(ok>1?'ões':'')+' aplicada'+(ok>1?'s':''));document.getElementById('ucmd').value='';}
  else showFb('Nenhuma atualização'+(errs.length?' · não encontrado: '+errs[0]:''),true);
}
// frentes/baixa/histórico · compartilhado entre caso e prospecção
function applyTaskLike(c,field,value){
  if(!c.tarefas)c.tarefas=[];if(!c.historico)c.historico=[];
  if(field==='tarefa'){
    const parts=value.split('|').map(s=>s.trim());
    const texto=parts[0]||'';const tipoRaw=(parts[1]||'tarefa').toLowerCase();
    const tipoMap={
      prazo:'prazo',judicial:'prazo','prazo judicial':'prazo',
      'julgamento presencial':'julg_pres','julg presencial':'julg_pres',julgamento:'julg_pres',presencial:'julg_pres',julg_pres:'julg_pres','sustentação oral':'julg_pres',sustentacao:'julg_pres',
      'julgamento virtual':'julg_virt','julg virtual':'julg_virt',virtual:'julg_virt',julg_virt:'julg_virt','sessão virtual':'julg_virt','sessao virtual':'julg_virt',
      audiencia:'audiencia','audiência':'audiencia',despacho:'audiencia','audiência/despacho':'audiencia','audiencia/despacho':'audiencia',
      tarefa:'tarefa',interna:'tarefa',
      followup:'followup','follow-up':'followup','follow up':'followup',proposta:'followup',aguardando:'followup'
    };
    const tipo=tipoMap[tipoRaw]||'tarefa';
    let data='',dataInicio='',dataFim='';
    if(parts[2]){
      const rng=parts[2].split(/\s+(?:a|até|-|-|→)\s+/);
      if(rng.length===2){const d1=parseDate(rng[0].trim()),d2=parseDate(rng[1].trim());if(tipo==='julg_virt'){data=d1;dataFim=d2;}else{dataInicio=d1;data=d2;}}
      else data=parseDate(parts[2]);
    }
    if(tipo!=='prazo')dataInicio='';
    if(tipo!=='julg_virt')dataFim='';
    if(texto)c.tarefas.push({id:uid(),texto,tipo,data,dataInicio,dataFim,feito:false,dataFeito:''});
    return true;
  }
  if(field==='baixa'||field==='concluir'||field==='feito'){
    const q=value.toLowerCase();const t=c.tarefas.find(x=>!x.feito&&x.texto.toLowerCase().includes(q));
    if(t){t.feito=true;t.dataFeito=new Date().toISOString().slice(0,10);c.historico.unshift({id:uid(),data:t.dataFeito,texto:'✓ '+t.texto});}
    return true;
  }
  if(field==='historico'||field==='histórico'||field==='evolucao'||field==='evolução'){
    c.historico.unshift({id:uid(),data:new Date().toISOString().slice(0,10),texto:value});return true;
  }
  return false;
}
function applyC(c,field,value){
  if(applyTaskLike(c,field,value))return;
  const sm={'em andamento':'em_andamento','em_andamento':'em_andamento',andamento:'em_andamento',aguardando:'aguardando',encerrado:'encerrado',liminar:'liminar',recurso:'recurso'};
  const fm={status:'status',nextsteps:'nextSteps',providencias:'nextSteps','providências':'nextSteps',resumo:'nextSteps',deadline:'deadline',prazo:'deadline',processnumber:'processNumber',processo:'processNumber',subject:'subject',assunto:'subject',tribunal:'tribunal'};
  const f=fm[field]||field;
  if(f==='status')c.status=sm[value.toLowerCase()]||value;
  else if(f==='deadline'){const dt=parseDate(value);c.tarefas.push({id:uid(),texto:'Prazo judicial',tipo:'prazo',data:dt,dataInicio:'',dataFim:'',feito:false,dataFeito:''});}
  else if(f in c)c[f]=value;
}
function applyP(p,field,value){
  if(applyTaskLike(p,field,value))return;
  const fm={stage:'stage','estágio':'stage',estagio:'stage',notes:'notes',subject:'subject',assunto:'subject',followup:'followupDate',lastcontact:'lastContact'};
  const sm={
    'fazer contato':'fazer_contato',fazer_contato:'fazer_contato','a contatar':'fazer_contato',contato:'fazer_contato','contato feito':'fazer_contato',
    'aguardando documentos':'aguardando_docs',aguardando_docs:'aguardando_docs',documentos:'aguardando_docs',docs:'aguardando_docs',
    'elaborar proposta':'elaborar_proposta',elaborar_proposta:'elaborar_proposta',proposta:'elaborar_proposta','análise':'elaborar_proposta',analise:'elaborar_proposta',pesquisa:'elaborar_proposta',
    'aguardando retorno da proposta':'aguardando_retorno',aguardando_retorno:'aguardando_retorno','aguardando retorno':'aguardando_retorno',aguardando:'aguardando_retorno','proposta enviada':'aguardando_retorno','retorno':'aguardando_retorno',
    contratou:'contratou',fechado:'contratou',
    'não contratou':'nao_contratou','nao contratou':'nao_contratou',nao_contratou:'nao_contratou',perdido:'nao_contratou'
  };
  const f=fm[field.toLowerCase()]||field;
  if(f==='stage')p.stage=sm[value.toLowerCase()]||value;
  else if(f==='followupDate'||f==='lastContact')p[f]=parseDate(value);
  else if(f in p)p[f]=value;
}

// ══ RENDER SHELL ═══════════════════════════════════════
const TABS_DEF=[{id:'dashboard',label:'Painel'},{id:'prospeccao',label:'Prospecção'},{id:'casos',label:'Casos'},{id:'honorarios',label:'Honorários'},{id:'contabil',label:'Contábil'}];
function render(){
  const now=new Date();
  document.getElementById('hdr-date').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const jud=judAlertCount();
  document.getElementById('hdr-alert').innerHTML=jud>0?`<div class="alert-pill pill-red">${jud} ${jud>1?'atos judiciais ≤7d':'ato judicial ≤7d'}</div>`:`<div class="alert-pill pill-grn">Sem prazos críticos</div>`;
  const pAtivas=S.prospeccao.filter(p=>!['contratou','nao_contratou'].includes(p.stage)).length;
  const cAtivos=S.casos.filter(c=>c.status!=='encerrado').length;

  const builders={dashboard:bDash,casos:bCasos,honorarios:bHon,prospeccao:bProsp,contabil:bCont};
  document.getElementById('tab-body').innerHTML=(builders[S.tab]||bDash)();
  if(S.tab==='casos'&&S.casosView==='kanban')wireKanban('caso');

function setTab(t){S.tab=t;S.editId=null;S.editHonId=null;S.editHonHid=null;_editTaskId=null;S.mobileDetail=false;render();window.scrollTo(0,0);}
function judAlertCount(){
  let n=0;
  S.casos.forEach(c=>{if(c.status==='encerrado')return;judTasks(c).forEach(tk=>{const d=daysTo(tk.data);if(d!==null&&d<=7)n++;});});
  S.prospeccao.forEach(p=>{if(['contratou','nao_contratou'].includes(p.stage))return;judTasks(p).forEach(tk=>{const d=daysTo(tk.data);if(d!==null&&d<=7)n++;});});
  return n;
}

// ─── DASHBOARD ─────────────────────────────────────────
function bDash(){
  // ── atos judiciais (casos + prospecções ativas, ordenados por data)
  const judItems=[];
  const pushJud=(item,isP)=>judTasks(item).forEach(tk=>judItems.push({d:daysTo(tk.data),c:item,tk,isP}));
  S.casos.filter(c=>c.status!=='encerrado').forEach(c=>pushJud(c,false));
  S.prospeccao.filter(p=>!['contratou','nao_contratou'].includes(p.stage)).forEach(p=>pushJud(p,true));
  judItems.sort((a,b)=>a.d-b.d);

  const judHtml=judItems.length?judItems.map(({d,c,tk,isP})=>{
    const meta=TASK_TIPOS[tk.tipo]||TASK_TIPOS.prazo;const over=d<0;
    const nome=itemName(c),proc=c.processNumber||'';
    const janP=tk.tipo==='prazo'&&tk.dataInicio, janJ=tk.tipo==='julg_virt'&&tk.dataFim;
    const janela=janP?`<span style="color:${meta.color};font-weight:600">abre ${fDateShort(tk.dataInicio)} → fatal ${fDateShort(tk.data)}</span> · `
      :janJ?`<span style="color:${meta.color};font-weight:600">sessão ${fDateShort(tk.data)} → ${fDateShort(tk.dataFim)}</span> · `:'';
    const cal=janP?gcalWindow(nome+' · '+tk.texto,tk.dataInicio,tk.data,proc)
      :janJ?gcalWindow(nome+' · '+tk.texto,tk.data,tk.dataFim,proc)
      :gcalLink(nome+' · '+tk.texto,tk.data,proc);
    const barCol=over?'var(--red)':meta.color;
    const itemBg=over?'background:var(--red-bg);border-color:var(--red-b);':meta.bg?`background:${meta.bg};border-color:${meta.bd};`:'';
    return`<div class="tl-item" style="border-left:4px solid ${barCol};${itemBg}" onclick="${isP?'goProsp':'goCaso'}('${c.id}')">
      <div class="tl-c">
        <div class="tl-lbl"><span style="display:inline-flex;align-items:center;gap:3px;color:${meta.color};font-weight:700">${meta.icon} ${meta.short}</span>${c.tribunal?' · '+c.tribunal:''}${isP?' · <span style="color:var(--faint)">prospecção</span>':''}</div>
        <div class="tl-main">${nome}</div>
        <div class="tl-sub">${janela}${esc(tk.texto)}${proc?' · '+proc:''}</div>
      </div>
      <div class="tl-r">
        <div class="tl-days" style="color:${over?'var(--red)':meta.color}">${over?Math.abs(d)+'d atr.':d===0?'hoje':d+'d'}</div>
        <a href="${cal}" target="_blank" onclick="event.stopPropagation()" class="mini-cal">Agenda</a>
      </div>
    </div>`;
  }).join(''):`<div class="empty" style="padding:22px"><div class="big">Nenhum ato judicial pendente</div>Você está em dia com prazos, julgamentos e audiências.</div>`;

  // ── outras tarefas com data (não judiciais) de casos e prospecções + honorários · 60d
  const outros=[];
  const pushTasks=(item,isP)=>pendTasks(item).forEach(tk=>{
    if(isJud(tk.tipo)||!tk.data)return;const d=daysTo(tk.data);if(d>60)return;
    outros.push({sort:d,kind:'task',c:item,tk,d,isP});
  });
  S.casos.filter(c=>c.status!=='encerrado').forEach(c=>pushTasks(c,false));
  S.prospeccao.filter(p=>!['contratou','nao_contratou'].includes(p.stage)).forEach(p=>pushTasks(p,true));
  getAllProximasParcelas(60).forEach(it=>{if(it.dl===null||it.dl>60)return;outros.push({sort:it.dl+.5,kind:'hon',it,d:it.dl});});
  outros.sort((a,b)=>a.sort-b.sort);
  const outrosHtml=outros.length?outros.map(o=>{
    const over=o.d<0,urg=o.d>=0&&o.d<=7;const cls=over?'tl-overdue':urg?'tl-urgent':o.kind==='hon'?'tl-honor':'tl-near';
    if(o.kind==='hon'){
      return`<div class="tl-item ${cls}" onclick="goCaso('${o.it.casoId}')"><div class="tl-bar"></div><div class="tl-c"><div class="tl-lbl">Honorário · ${o.it.tipo==='proLabore'?'pro-labore':'êxito'}</div><div class="tl-main">${o.it.client}</div><div class="tl-sub">${fCur(o.it.parcela.valor)}${o.it.parcela.descricao?' · '+o.it.parcela.descricao:''}</div></div><div class="tl-r"><div class="tl-days">${over?'atr.':o.d===0?'hoje':o.d+'d'}</div></div></div>`;
    }
    const m2=TASK_TIPOS[o.tk.tipo]||TASK_TIPOS.tarefa;const nome=itemName(o.c);
    return`<div class="tl-item ${cls}" onclick="${o.isP?'goProsp':'goCaso'}('${o.c.id}')"><div class="tl-bar"></div><div class="tl-c"><div class="tl-lbl">${m2.icon} ${m2.short}${o.isP?' · <span style="color:var(--faint)">prospecção</span>':''}</div><div class="tl-main">${nome}</div><div class="tl-sub">${esc(o.tk.texto)}</div></div><div class="tl-r"><div class="tl-days">${over?'atr.':o.d===0?'hoje':o.d+'d'}</div><a href="${gcalLink(nome+' · '+o.tk.texto,o.tk.data,'')}" target="_blank" onclick="event.stopPropagation()" class="mini-cal">Agenda</a></div></div>`;
  }).join(''):`<p style="font-size:12px;color:var(--muted);padding:4px">Nada agendado nos próximos 60 dias.</p>`;

  // ── tarefas sem data (a fazer) agrupadas por caso
  const semData=[];
  S.casos.filter(c=>c.status!=='encerrado').forEach(c=>{
    const tf=pendTasks(c).filter(t=>t.tipo==='tarefa'&&!t.data);
    if(tf.length)semData.push({c,tf});
  });

  // ── prospecção: elaborar proposta / aguardando retorno
  const propostas=S.prospeccao.filter(p=>['elaborar_proposta','aguardando_retorno'].includes(p.stage));

  return`
<div style="margin-bottom:22px">
  <div class="sec-title">⚖ Prazos e atos judiciais <span class="sec-hint">- prioridade máxima · clique para abrir o caso</span></div>
  <div class="tl">${judHtml}</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px">
  <div>
    <div class="sec-title">Agenda de tarefas e cobranças <span class="sec-hint">60 dias</span></div>
    <div class="tl">${outrosHtml}</div>
  </div>
  <div>
    <div class="sec-title">Prospecção · propostas e aguardando <span class="sec-hint">${propostas.length}</span></div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:18px">
      ${propostas.length?propostas.map(p=>{const sc=STAGE_COLOR[p.stage]||STAGE_COLOR.fazer_contato;const lbl=(STAGES.find(s=>s.id===p.stage)||{}).label||p.stage;const fuV=p.followupDate&&daysTo(p.followupDate)<=0;return`<div class="tl-item" style="padding:9px 13px;border-left:4px solid ${sc.fg}" onclick="goProsp('${p.id}')"><div class="tl-c"><div class="tl-lbl" style="color:${sc.fg}">${lbl}</div><div class="tl-main" style="font-size:12.5px">${p.name}</div>${p.subject?`<div class="tl-sub">${esc(p.subject)}</div>`:''}</div>${p.followupDate?`<div class="tl-r"><span style="font-size:10.5px;font-weight:600;color:${fuV?'var(--red)':'var(--ora)'}">${fuV?'follow-up!':fDateShort(p.followupDate)}</span></div>`:''}</div>`;}).join(''):`<p style="font-size:12px;color:var(--muted)">Nenhuma proposta em elaboração ou aguardando retorno.</p>`}
    </div>
    <div class="sec-title">Monitoramento PJe</div>
    <div class="pje-grid">${PJE.map(l=>`<a class="pje-a" href="${l.url}" target="_blank"><h4>${l.label}</h4><p>Ver publicações</p></a>`).join('')}</div>
  </div>
</div>

${semData.length?`<div style="margin-bottom:10px">
  <div class="sec-title">Providências sem data marcada <span class="sec-hint">clique para abrir e dar baixa</span></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">
    ${semData.map(({c,tf})=>`<div class="tl-item" style="padding:10px 13px;align-items:flex-start" onclick="goCaso('${c.id}')"><div class="tl-bar" style="background:var(--line2)"></div><div class="tl-c"><div class="tl-main" style="font-size:12.5px">${c.client}</div>${tf.slice(0,3).map(t=>`<div class="tl-sub" style="white-space:normal">• ${esc(t.texto)}</div>`).join('')}${tf.length>3?`<div class="tl-sub">+${tf.length-3} mais</div>`:''}</div></div>`).join('')}
  </div>
</div>`:''}`;
}
function goCaso(id){S.tab='casos';S.selCaso=id;S.mobileDetail=true;S.casosView='lista';render();window.scrollTo(0,0);}
function goProsp(id){S.tab='prospeccao';S.selProsp=id;S.mobileDetail=true;S.prospView='lista';render();window.scrollTo(0,0);}

// ─── CASOS: master-detail + kanban ─────────────────────
const CASO_COLS=[
  {id:'em_andamento',label:'Em andamento',color:'var(--blu)'},
  {id:'liminar',label:'Liminar',color:'var(--red)'},
  {id:'recurso',label:'Recurso',color:'var(--car)'},
  {id:'aguardando',label:'Aguardando',color:'var(--ora)'},
  {id:'encerrado',label:'Encerrado',color:'var(--grn)'},
];
function casoMatchesSearch(c){
  if(!S.search)return true;const q=S.search.toLowerCase();
  return c.client.toLowerCase().includes(q)||(c.subject||'').toLowerCase().includes(q)||(c.processNumber||'').toLowerCase().includes(q)||(c.tribunal||'').toLowerCase().includes(q);
}
function casoFilterList(){
  let base=filterByTag(S.casos).filter(casoMatchesSearch);
  if(S.filter==='ativos')base=base.filter(c=>c.status!=='encerrado');
  else if(S.filter==='judicial')base=base.filter(c=>c.type==='judicial');
  else if(S.filter==='consultivo')base=base.filter(c=>c.type==='consultivo');
  else if(S.filter==='prazos')base=base.filter(c=>judTasks(c).length>0);
  return base;
}
function bCasos(){
  const list=sortC(casoFilterList());
  // seleção default = primeiro da lista
  if(S.selCaso&&!S.casos.find(c=>c.id===S.selCaso))S.selCaso=null;
  const view=S.casosView||'lista';

  const FILTERS=[{id:'ativos',label:'Ativos'},{id:'todos',label:'Todos'},{id:'prazos',label:'⚖ Com prazo'},{id:'judicial',label:'Judiciais'},{id:'consultivo',label:'Consultivos'}];
  const bar=`${tagFilterBanner()}<div class="top-bar">
    <div class="filters">${FILTERS.map(f=>`<button class="fbtn${S.filter===f.id?' on':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('')}</div>

      <div class="seg"><button class="${view==='lista'?'on':''}" onclick="S.casosView='lista';render()">Lista + detalhe</button><button class="${view==='kanban'?'on':''}" onclick="S.casosView='kanban';render()">Quadro</button></div>
      <button class="btn-new" onclick="openModal('caso')">+ Novo caso</button>
    </div>
  </div>`;

  if(view==='kanban'){
    const cols=CASO_COLS;
    return bar+`<div class="kb-scroll"><div class="kb">${cols.map(col=>{
      const cards=sortC(list.filter(c=>statusEf(c)===col.id));
      return`<div class="kb-col"><div class="kb-col-h" style="border-left-color:${col.color}"><span class="t" style="color:${col.color}">${col.label}</span><span class="c">${cards.length}</span></div>
      <div class="kb-drop" data-status="${col.id}">${cards.map(c=>kbCard(c)).join('')||''}</div></div>`;
    }).join('')}</div></div>`;
  }

  // LISTA + DETALHE
  const sel=S.selCaso?S.casos.find(c=>c.id===S.selCaso):null;

  return bar+`<div class="md">
    <div class="md-list ${hideList}">
      <div class="md-search"><input placeholder="Buscar caso, cliente, processo…" value="${esc(S.search)}" oninput="S.search=this.value;rerenderCasos()"></div>
      <div class="md-rows">${list.length?list.map(c=>caseRow(c)).join(''):`<div class="empty" style="padding:26px">Nenhum caso neste filtro.</div>`}</div>
    </div>
    ${sel?`<div class="drawer-bg" onclick="fecharFicha()"></div>`:''}<div class="md-detail ${hideDetail} ${sel?'open':''}">
      <button class="drawer-x" onclick="fecharFicha()" title="Fechar (Esc)">× Fechar</button>
      ${sel?caseDetail(sel):`<div class="empty" style="padding:60px"><div class="big">Selecione um caso</div>Escolha um caso na lista para ver os detalhes.</div>`}

function rerenderCasos(){
  // atualiza só a lista sem perder foco do input
  const list=sortC(casoFilterList());
  const el=document.querySelector('.md-rows');if(el)el.innerHTML=list.length?list.map(c=>caseRow(c)).join(''):`<div class="empty" style="padding:26px">Nenhum caso neste filtro.</div>`;

function setFilter(f){S.filter=f;S.selCaso=null;render();}
function selectCaso(id){S.selCaso=id;S.mobileDetail=true;render();}

function caseRow(c){
  const sel=S.selCaso===c.id;const p=nextPrazo(c);const d=p?daysTo(p):null;
  const hasJud=judTasks(c).length>0;
  let ddCls='dd-ok',ddTxt='';
  if(d!==null){if(hasJud&&d<=7){ddCls=d<0?'dd-over':'dd-jud';ddTxt=d<0?Math.abs(d)+'d':d+'d';}else if(d<0){ddCls='dd-over';ddTxt='atr.';}else if(d<=7){ddCls='dd-urg';ddTxt=d+'d';}else{ddCls='dd-ok';ddTxt=fDateShort(p);}}
  const nPend=pendTasks(c).length;
  const dotColor={em_andamento:'var(--blu)',aguardando:'var(--ora)',liminar:'var(--red)',recurso:'var(--car)',encerrado:'var(--grn)'}[c.status]||'var(--muted)';
  return`<div class="md-row ${sel?'sel':''} ${hasJud?'has-jud':''}" onclick="selectCaso('${c.id}')">
    <div class="md-row-bar"></div>
    <div class="md-dot" style="background:${dotColor}"></div>
    <div class="md-row-c">
      <div class="md-row-name">${c.client}</div>
      <div class="md-row-meta">${c.type==='consultivo'?'Consultivo':(c.tribunal||'Judicial')}${nPend?' · '+nPend+' pendente'+(nPend>1?'s':''):''}</div>
    </div>
    <div class="md-row-r">
      ${d!==null?`<span class="md-row-days ${ddCls}">${hasJud&&d<=7?'⚖ ':''}${ddTxt}</span>`:''}
      ${(c.tagIds||[]).length?`<div style="display:flex;gap:2px">${(c.tagIds||[]).slice(0,2).map(id=>{const t=getTag(id);if(!t)return'';const col=getColor(t.color);return`<span style="width:8px;height:8px;border-radius:50%;background:${col.hex}" title="${t.label}"></span>`;}).join('')}</div>`:''}
    </div>
  </div>`;
}

// ── DETALHE do caso ────────────────────────────────────
function caseDetail(c){
  const tUrl=c.tribunal&&TRIBUNAIS[c.tribunal]?TRIBUNAIS[c.tribunal]:null;
  const tarefas=c.tarefas||[];
  // ordenar: prazo judicial primeiro, depois por data, depois sem data; feitos ao fim
  const ord=(a,b)=>{if(a.feito!==b.feito)return a.feito?1:-1;const pa=a.tipo==='prazo'?0:1,pb=b.tipo==='prazo'?0:1;if(pa!==pb)return pa-pb;return(a.data||'zzzz').localeCompare(b.data||'zzzz');};
  const tks=[...tarefas].sort(ord);
  const pend=tks.filter(t=>!t.feito),done=tks.filter(t=>t.feito);
  const hist=(c.historico||[]);
  const hons=c.honorarios||[];
  let hRest=0;hons.forEach(h=>hRest+=(h.valor||0)-getPago(h));

  return`
<div class="dt-head">
  <div class="dt-top">
    <div>
      <div class="dt-name">${c.client}</div>
      <div class="dt-meta">
        <span class="badge ${sBadge(statusEf(c))}">${sLabel(statusEf(c))}</span>
        <span>${c.type==='consultivo'?'Consultivo':'Judicial'}</span>
        ${c.tribunal?`<span>·</span><span>${tUrl?`<a href="${tUrl}" target="_blank">${c.tribunal} ↗</a>`:c.tribunal}</span>`:''}
        ${c.processNumber?`<span>·</span><span class="mono">${c.processNumber}</span>`:''}
        
      </div>
    </div>
    <div class="dt-actions">
      <button class="iconbtn" onclick="startEdit('${c.id}')" title="Editar dados">Editar</button>
      <button class="iconbtn del" onclick="delC('${c.id}')" title="Remover">Remover</button>
    </div>
  </div>
  ${(c.tagIds||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">${(c.tagIds||[]).map(id=>tagPill(id)).join('')}</div>`:''}
</div>

<div class="dt-body">
  ${tasksSection(c)}
  ${(c.subject||c.nextSteps)?`<div class="dt-sec"><div class="dt-sec-h"><h4>Resumo do caso</h4></div>${c.subject?`<p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${esc(c.subject)}</p>`:''}${c.nextSteps?`<div class="summary-box">${esc(c.nextSteps)}</div>`:''}</div>`:''}
  ${honSection(c,false)}
  ${histSection(c)}
</div>`;
}
let _showDone={};
function toggleDone(cid){_showDone[cid]=!_showDone[cid];render();}

// ── seções compartilhadas (caso e prospecção) ──────────
function taskSort(a,b){if(a.feito!==b.feito)return a.feito?1:-1;const pa=isJud(a.tipo)?0:1,pb=isJud(b.tipo)?0:1;if(pa!==pb)return pa-pb;return(a.data||'zzzz').localeCompare(b.data||'zzzz');}
function tasksSection(item){
  const tks=[...(item.tarefas||[])].sort(taskSort);

      <span id="nt-x-wrap-${item.id}" style="display:none;flex-direction:column;gap:2px"><span id="nt-x-lbl-${item.id}" style="font-size:9px;color:var(--faint)">até</span><input type="date" id="nt-x-${item.id}" style="width:128px"></span>

  </div>`;
}
function honSection(item,estimate){
  const hons=item.honorarios||[];
  let hRest=0;hons.forEach(h=>hRest+=(h.valor||0)-getPago(h));
  const title=estimate?`Honorários <span style="font-weight:400;color:var(--muted);font-size:11px">· estimativa / negociação</span>`:'Honorários';

let _dragging=false,_dragId=null;
function wireKanban(type){
  _dragging=false;
  document.querySelectorAll('.kb-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{_dragging=true;_dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');setTimeout(()=>_dragging=false,50);});
  });
  document.querySelectorAll('.kb-drop').forEach(drop=>{
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{
      e.preventDefault();drop.classList.remove('over');
      const newStatus=drop.dataset.status;if(!_dragId)return;
      if(type==='caso'){const c=S.casos.find(x=>x.id===_dragId);if(c&&c.status!==newStatus){c.status=newStatus;saveData();render();}}
      else{const p=S.prospeccao.find(x=>x.id===_dragId);if(p&&p.stage!==newStatus){p.stage=newStatus;saveData();render();}}
      _dragId=null;
    });
  });
}

const STAGE_COLOR={
  fazer_contato:{fg:'var(--muted)',bg:'#eef1f4',bd:'var(--line2)'},
  aguardando_docs:{fg:'var(--ora)',bg:'var(--ora-bg)',bd:'var(--ora-b)'},
  elaborar_proposta:{fg:'var(--car)',bg:'var(--car-bg)',bd:'var(--car-b)'},
  aguardando_retorno:{fg:'var(--amb)',bg:'#fdf3e3',bd:'#f2d9a8'},
  contratou:{fg:'var(--grn)',bg:'var(--grn-bg)',bd:'var(--grn-b)'},
  nao_contratou:{fg:'var(--red)',bg:'var(--red-bg)',bd:'var(--red-b)'},
};
function daysSince(d){if(!d)return null;return Math.floor((today0()-new Date(d+'T12:00:00'))/864e5);}
function prospMatch(p){if(!S.search)return true;const q=S.search.toLowerCase();return p.name.toLowerCase().includes(q)||(p.subject||'').toLowerCase().includes(q)||(p.notes||'').toLowerCase().includes(q);}
function prospList(){
  let base=filterByTag(S.prospeccao).filter(prospMatch);
  const f=S.prospFilter||'ativos';
  if(f==='ativos')base=base.filter(p=>!['contratou','nao_contratou'].includes(p.stage));
  else if(f==='proposta')base=base.filter(p=>['elaborar_proposta','aguardando_retorno'].includes(p.stage));
  else if(f==='contratou')base=base.filter(p=>p.stage==='contratou');
  else if(f==='nao_contratou')base=base.filter(p=>p.stage==='nao_contratou');
  return base;
}
function sortP(arr){const now=today0();return[...arr].sort((a,b)=>{
  const af=a.followupDate&&daysTo(a.followupDate)<=0,bf=b.followupDate&&daysTo(b.followupDate)<=0;
  if(af!==bf)return af?-1:1;
  const ao=STAGES.findIndex(s=>s.id===a.stage),bo=STAGES.findIndex(s=>s.id===b.stage);
  if(ao!==bo)return bo-ao;return a.name.localeCompare(b.name,'pt-BR');
});}
function bProsp(){
  const list=sortP(prospList());
  if(S.selProsp&&!S.prospeccao.find(p=>p.id===S.selProsp))S.selProsp=null;
  const view=S.prospView||'lista';const allP=filterByTag(S.prospeccao);

// ─── CONTÁBIL ──────────────────────────────────────────
function bCont(){
  const now=new Date();const mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const cd=S.contabil[mk]||{};const das=new Date(now.getFullYear(),now.getMonth(),20);
  const dl=Math.ceil((das-now)/864e5),du=!cd.dasPago&&dl<=7;
  function chk(lbl,f,v){return`<div class="check-item${v?' done':''}"><input type="checkbox" id="ck-${f}" ${v?'checked':''} onchange="ckCo('${mk}','${f}',this.checked)"><label for="ck-${f}">${lbl}</label></div>`;}
  const nfs=cd.nfs||[];
  return`<h2 style="font-size:16px;font-weight:600;margin-bottom:16px;text-transform:capitalize">${now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2>
<div class="card"><h3 style="font-size:13px;font-weight:600;margin-bottom:12px">Checklist mensal</h3>
  ${chk('NFs emitidas após recebimento','nfsEmitidas',cd.nfsEmitidas)}
  ${chk('Categorização Conube ao longo do mês','conubeFeito',cd.conubeFeito)}
  ${chk('Fechamento Conube (1º do próximo mês)','fechConube',cd.fechConube)}
  <div class="das-row"><div class="check-item${cd.dasPago?' done':''}" style="border:none;padding:0"><input type="checkbox" id="ck-das" ${cd.dasPago?'checked':''} onchange="ckCo('${mk}','dasPago',this.checked)"><label for="ck-das">DAS pago · vencimento dia 20</label></div><span style="font-size:11.5px;font-weight:700;color:${du?'var(--red)':cd.dasPago?'var(--grn)':'var(--muted)'}">${cd.dasPago?'✓ Pago':du?'Urgente: '+dl+'d':Math.max(0,dl)+' dias'}</span></div>
</div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:13px;font-weight:600">NFs emitidas este mês</h3><button class="btn btn-pri btn-sm" onclick="openModal('nf')">+ Registrar NF</button></div>
  ${!nfs.length?`<p style="font-size:12px;color:var(--muted)">Nenhuma NF registrada.</p>`:nfs.map((nf,i)=>`<div class="nf-row"><span>${esc(nf.client)}${nf.number?' · NF '+nf.number:''}</span><div style="display:flex;gap:8px;align-items:center"><span style="color:var(--muted)">${fCur(nf.valor)}</span><button class="alink del" onclick="delNF('${mk}',${i})">×</button></div></div>`).join('')}
  ${nfs.length?`<div style="font-size:12.5px;font-weight:700;margin-top:10px">Total: ${fCur(nfs.reduce((s,n)=>s+(n.valor||0),0))}</div>`:''}
</div>`;
}

function bLI(){
  const active=LISTAGES.filter(s=>S.linkedin.some(p=>p.stage===s));
  return`<div class="top-bar"><div class="sec-title" style="margin:0">Fila de conteúdo</div><button class="btn-new" onclick="openModal('li')">+ Nova ideia</button></div>
${!S.linkedin.length?`<div class="empty"><div class="big">Nenhum post na fila</div>Adicione uma ideia para começar.</div>`:`<div class="lipipe">${active.map(s=>`<div><div class="pipe-col-h">${s}</div>${S.linkedin.filter(p=>p.stage===s).map(p=>`<div class="licard"><p>${esc(p.content)}</p>${p.scheduledDate?`<small>Agendado: ${fDate(p.scheduledDate)}</small>`:''}<div class="licard-foot"><select onchange="updLI('${p.id}',this.value)">${LISTAGES.map(st=>`<option value="${st}" ${p.stage===st?'selected':''}>${st}</option>`).join('')}</select><button class="alink del" onclick="delLI('${p.id}')">×</button></div></div>`).join('')}</div>`).join('')}</div>`}`;

function ckCo(key,field,val){if(!S.contabil[key])S.contabil[key]={};S.contabil[key][field]=val;saveData();render();}
function delNF(mk,i){S.contabil[mk].nfs.splice(i,1);saveData();render();}
function updLI(id,stage){S.linkedin=S.linkedin.map(p=>p.id===id?{...p,stage}:p);saveData();render();}
function delLI(id){S.linkedin=S.linkedin.filter(p=>p.id!==id);saveData();render();}

function prospEditForm(p){

function saveProspEdit(id){
  const p=S.prospeccao.find(x=>x.id===id);if(!p)return;

function saveProsp(){
  const n=gv('mp-n').trim();if(!n){alert('Informe o nome');return;}
  const p={id:uid(),name:n,stage:gv('mp-s'),subject:gv('mp-su').trim(),notes:gv('mp-no').trim(),lastContact:gv('mp-lc'),followupDate:gv('mp-fu'),tagIds:collectTagIds('mp-tag-'),tarefas:[],historico:[],honorarios:[]};
  S.prospeccao.push(p);S.selProsp=p.id;saveData();closeModal();render();

function saveNF(){
  const c=gv('mnf-c').trim();if(!c){alert('Informe o cliente');return;}
  const now=new Date();const mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  if(!S.contabil[mk])S.contabil[mk]={};if(!S.contabil[mk].nfs)S.contabil[mk].nfs=[];
  S.contabil[mk].nfs.push({id:uid(),client:c,number:gv('mnf-n').trim(),valor:parseFloat(gv('mnf-v'))||0});
  saveData();closeModal();render();
}
function saveLI(){const c=gv('mli-c').trim();if(!c){alert('Informe o conteúdo');return;}S.linkedin.push({id:uid(),content:c,stage:gv('mli-s'),scheduledDate:gv('mli-d')});saveData();closeModal();render();}

function exportResume(){
  const lines=['=== ESTADO ATUAL · ESCRITÓRIO ===','','CASOS ATIVOS:'];
  sortC(S.casos.filter(c=>c.status!=='encerrado')).forEach(c=>{
    lines.push('• '+c.client+' ['+sLabel(c.status)+']'+(c.tribunal?' · '+c.tribunal:'')+(c.processNumber?' ('+c.processNumber+')':''));
    judTasks(c).forEach(t=>lines.push('  ⚖ PRAZO '+fDate(t.data)+': '+t.texto));
    pendTasks(c).filter(t=>t.tipo!=='prazo').slice(0,4).forEach(t=>lines.push('  → '+t.texto+(t.data?' ('+fDate(t.data)+')':'')));
  });
  lines.push('','PROSPECÇÕES ATIVAS:');
  S.prospeccao.filter(p=>!['fechado','perdido'].includes(p.stage)).forEach(p=>lines.push('• '+p.name+' ['+((STAGES.find(s=>s.id===p.stage)||{}).label||p.stage)+']'+(p.subject?' · '+p.subject:'')));
  const txt=lines.join('\n');
  navigator.clipboard.writeText(txt).then(()=>alert('Copiado! Cole no Claude para sincronizar.')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Copiado!');});
}

// ══ MIGRATION ══════════════════════════════════════════
function migrate(){
  const carIds={c03:true,c14:true,c15:true};
  let changed=false;
  S.casos.forEach(c=>{
    if(!c.tarefas)c.tarefas=[];if(!c.historico)c.historico=[];if(!c.tagIds)c.tagIds=[];
    if(carIds[c.id]&&c.group!=='carneiros'){c.group='carneiros';changed=true;}
    if(carIds[c.id]&&!c.tagIds.includes('tag-car')){c.tagIds.push('tag-car');changed=true;}
    (c.honorarios||[]).forEach(h=>{if(!h.parcelas)h.parcelas=[];});
    // garantir campos de janela em tarefas judiciais
    c.tarefas.forEach(t=>{if(isJud(t.tipo)){if(t.dataInicio===undefined)t.dataInicio='';if(t.dataFim===undefined)t.dataFim='';}});
    // limpar campo legado c.deadline (aposentado · resíduo de versões antigas)
    if('deadline' in c){delete c.deadline;changed=true;}
  });
  // prospecção: migrar estágios antigos → novos e garantir arrays
  const stageMap={a_contatar:'fazer_contato',contato:'fazer_contato',analise:'elaborar_proposta',pesquisa:'elaborar_proposta',proposta:'aguardando_retorno',aguardando:'aguardando_retorno',fechado:'contratou',perdido:'nao_contratou'};
  const validStages=STAGES.map(s=>s.id);
  S.prospeccao.forEach(p=>{
    if(!p.tagIds)p.tagIds=[];if(!p.tarefas)p.tarefas=[];if(!p.historico)p.historico=[];if(!p.honorarios)p.honorarios=[];
    if(stageMap[p.stage]){p.stage=stageMap[p.stage];changed=true;}
    if(!validStages.includes(p.stage)){p.stage='fazer_contato';changed=true;}
  });
  return changed;
}

function maisDias(n){const d=today0();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function normHora(v){if(!v)return'';const m=String(v).match(/(\d{1,2})\s*(?:[:h]\s*(\d{2})?)/i);if(!m)return'';const h=+m[1],mi=m[2]?+m[2]:0;if(h>23||mi>59)return'';return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');}
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3800);}
function gcalTask(c,t){
  const title=itemName(c)+' · '+t.texto,proc=c.processNumber||'';
  if(t.tipo==='prazo'&&t.dataInicio)return gcalWindow(title,t.dataInicio,t.data,proc);
  if(t.tipo==='julg_virt'&&t.dataFim)return gcalWindow(title,t.data,t.dataFim,proc);
  if(t.data&&t.hora){
    const[hh,mm]=t.hora.split(':').map(Number);const day=t.data.replace(/-/g,'');
    const s=day+'T'+String(hh).padStart(2,'0')+String(mm).padStart(2,'0')+'00';
    const e=day+'T'+String(Math.min(hh+1,23)).padStart(2,'0')+String(mm).padStart(2,'0')+'00';
    return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('[Escritório] '+title)+'&dates='+s+'/'+e+'&ctz=America/Sao_Paulo&details='+encodeURIComponent(proc);
  }
  return gcalLink(title,t.data,proc);
}

// ── conjuntos ──────────────────────────────────────────
function ativosC(){return S.casos.filter(c=>c.status!=='encerrado');}
function ativosP(){return S.prospeccao.filter(p=>!['contratou','nao_contratou'].includes(p.stage));}
function provItems(){
  const out=[];
  const push=(x,isP)=>pendTasks(x).forEach(t=>{if(!isJud(t.tipo)||t.tipo==='prazo')out.push({c:x,t,isP,d:t.data?daysTo(t.data):null});});
  ativosC().forEach(c=>push(c,false));ativosP().forEach(p=>push(p,true));
  return out;
}
function isHoje(o){return(o.d!==null&&o.d<=0)||!!o.t.foco;}
function provSort(a,b){
  const ka=a.d!==null&&a.d<=0?a.d:(a.t.foco?0.5:(a.d===null?999:a.d)),kb=b.d!==null&&b.d<=0?b.d:(b.t.foco?0.5:(b.d===null?999:b.d));
  if(ka!==kb)return ka-kb;return(a.t.hora||'99').localeCompare(b.t.hora||'99');
}
function whenOf(t,d){
  if(d===null)return t.foco?{txt:'★ hoje',col:'#b7791f'}:{txt:'sem data',col:'var(--faint)'};
  const h=t.hora?' '+t.hora:'';
  if(d<0)return{txt:Math.abs(d)+(Math.abs(d)>1?' dias':' dia')+' de atraso',col:'var(--red)'};
  if(d===0)return{txt:'hoje'+h,col:'var(--ora)'};
  if(d===1)return{txt:'amanhã'+h,col:'var(--blu)'};
  return{txt:fDateShort(t.data)+h,col:'var(--blu)'};
}

// ── PAINEL DO DIA ──────────────────────────────────────
function judBlock(){
  const items=[];
  const push=(x,isP)=>judTasks(x).forEach(tk=>items.push({d:daysTo(tk.data),c:x,tk,isP}));
  ativosC().forEach(c=>push(c,false));ativosP().forEach(p=>push(p,true));
  items.sort((a,b)=>a.d-b.d||(a.tk.hora||'99').localeCompare(b.tk.hora||'99'));
  if(!items.length)return`<div class="empty-ok">Nenhum prazo, julgamento, audiência ou despacho pendente.</div>`;
  return`<div class="tl">`+items.map(({d,c,tk,isP})=>{
    const meta=TASK_TIPOS[tk.tipo]||TASK_TIPOS.prazo;const over=d<0;const nome=itemName(c),proc=c.processNumber||'';
    const janP=tk.tipo==='prazo'&&tk.dataInicio,janJ=tk.tipo==='julg_virt'&&tk.dataFim;
    const janela=janP?`<span style="color:${meta.color};font-weight:600">abre ${fDateShort(tk.dataInicio)}, fatal ${fDateShort(tk.data)}</span> · `
      :janJ?`<span style="color:${meta.color};font-weight:600">sessão de ${fDateShort(tk.data)} a ${fDateShort(tk.dataFim)}</span> · `:'';
    const barCol=over?'var(--red)':meta.color;
    const itemBg=over?'background:var(--red-bg);border-color:var(--red-b);':meta.bg?`background:${meta.bg};border-color:${meta.bd};`:'';
    const dTxt=over?Math.abs(d)+'d atr.':d===0?'hoje':d===1?'amanhã':d+'d';
    return`<div class="tl-item" style="border-left:4px solid ${barCol};${itemBg}" onclick="${isP?'goProsp':'goCaso'}('${c.id}')">
      <div class="tl-c">
        <div class="tl-lbl"><span style="color:${meta.color};font-weight:700">${meta.icon} ${meta.short}</span>${c.tribunal?' · '+c.tribunal:''}${isP?' · <span style="color:var(--faint)">prospecção</span>':''}</div>
        <div class="tl-main">${esc(nome)}</div>
        <div class="tl-sub">${janela}${esc(tk.texto)}${proc?' · '+proc:''}</div>
      </div>
      <div class="tl-r">
        <div class="tl-days" style="color:${over?'var(--red)':meta.color}">${dTxt}</div>
        <div style="font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap">${fDiaSem(tk.data)}${tk.hora?' · '+tk.hora:''}</div>
        <a href="${gcalTask(c,tk)}" target="_blank" onclick="event.stopPropagation()" class="mini-cal">Agenda</a>
      </div>
    </div>`;
  }).join('')+`</div>`;
}
function dashRow(o){
  if(o.kind==='hon'){
    const w=o.d<0?{txt:Math.abs(o.d)+'d de atraso',col:'var(--red)'}:o.d===0?{txt:'hoje',col:'var(--ora)'}:{txt:fDateShort(o.it.parcela.vencimento),col:'var(--grn)'};
    return`<div class="dr ${o.d<0?'over':''}"><span style="width:18px;text-align:center;color:var(--grn);font-weight:700">$</span>
      <div class="dr-c"><div class="dr-txt">Receber ${esc(o.it.parcela.descricao||'parcela')}: ${fCur(o.it.parcela.valor)}</div>
      <div class="dr-meta"><span class="chip" style="color:var(--grn);background:var(--grn-bg);border-color:var(--grn-b)">Honorário ${o.it.tipo==='proLabore'?'pro-labore':'êxito'}</span><span class="dr-cli" onclick="goCaso('${o.it.casoId}')">${esc(o.it.client)}</span></div></div>
      <div class="dr-when" style="color:${w.col}">${w.txt}</div>
      <button class="btn btn-ghost btn-sm conv-btn" onclick="toggleParcela('${o.it.casoId}','${o.it.honorarioId}','${o.it.parcela.id}',true)" title="Marcar esta parcela como paga">Recebido</button></div>`;
  }
  if(o.kind==='nf'){
    const n=o.n;
    return`<div class="dr"><span style="width:18px;text-align:center;color:var(--ora);font-weight:700">NF</span>
      <div class="dr-c"><div class="dr-txt">Emitir nota fiscal: ${fCur(n.valor)}</div><div class="dr-meta"><span class="dr-cli" onclick="goCaso('${n.itemId}')">${esc(n.client)}</span> · ${esc(n.descricao)}</div></div>
      <div class="dr-when" style="color:var(--ora)">recebido ${fDateShort(n.data)}</div>
      <button class="btn btn-ghost btn-sm conv-btn" onclick="navGo('contabil')">Contábil ›</button></div>`;
  }
  if(o.kind==='conv'){
    const p=o.p;
    return`<div class="dr"><span style="width:18px;text-align:center;color:var(--grn);font-weight:700">✓</span>
      <div class="dr-c"><div class="dr-txt">Contratou: abrir o caso</div><div class="dr-meta"><span class="dr-cli" onclick="goProsp('${p.id}')">${esc(p.name)}</span>${p.subject?' · '+esc(p.subject):''}</div></div>
      <button class="btn btn-pri btn-sm conv-btn" onclick="openConvert('${p.id}')">Abrir caso</button>
      <button class="btn btn-ghost btn-sm conv-btn" onclick="jaTemCaso('${p.id}')" title="O caso já existe no painel">Já tem caso</button></div>`;
  }
  if(o.kind==='fu'){
    const p=o.p;const w=o.d<0?{txt:Math.abs(o.d)+'d de atraso',col:'var(--red)'}:o.d===0?{txt:'hoje',col:'var(--ora)'}:{txt:fDateShort(p.followupDate),col:'var(--blu)'};
    return`<div class="dr ${o.d<0?'over':''}"><span style="width:18px;text-align:center;color:var(--car)">↩</span>
      <div class="dr-c"><div class="dr-txt">Follow-up da prospecção</div><div class="dr-meta"><span class="dr-cli" onclick="goProsp('${p.id}')">${esc(p.name)}</span>${p.subject?' · '+esc(p.subject):''}</div></div>
      <div class="dr-when" style="color:${w.col}">${w.txt}</div></div>`;
  }
  const{c,t,d}=o;const w=whenOf(t,d);const subs=t.sub||[];const sd=subs.filter(s=>s.feito).length;
  return`<div class="dr ${d!==null&&d<0?'over':''}">
    <input type="checkbox" class="dr-chk" title="Concluir" onchange="toggleTask('${c.id}','${t.id}',this.checked)">
    <button class="star ${t.foco?'on':''}" title="${t.foco?'Tirar de hoje':'Fazer hoje'}" onclick="toggleFoco('${c.id}','${t.id}')">${t.foco?'★':'☆'}</button>
    <div class="dr-c"><div class="dr-txt">${esc(t.texto)}</div>
      <div class="dr-meta">${chipTipo(t)}${chipEtapa(t)}<span class="dr-cli" onclick="${goItem(c)}">${esc(itemName(c))}</span>${o.isP?'<span style="color:var(--faint)">prospecção</span>':''}${subs.length?`<span>☑ ${sd}/${subs.length}</span>`:''}</div></div>
    <div class="dr-when" style="color:${w.col}">${w.txt}</div></div>`;
}
function bDash(){
  const prov=provItems();
  const hoje=prov.filter(o=>!isJud(o.t.tipo)&&isHoje(o)).map(o=>Object.assign({kind:'task'},o));
  const prox=prov.filter(o=>!isJud(o.t.tipo)&&o.d!==null&&o.d>=1&&o.d<=7&&!o.t.foco).map(o=>Object.assign({kind:'task'},o));
  getAllProximasParcelas(60).forEach(it=>{if(it.dl===null)return;if(it.dl<=0)hoje.push({kind:'hon',it,d:it.dl});else if(it.dl<=7)prox.push({kind:'hon',it,d:it.dl});});
  ativosP().forEach(p=>{
    if(!p.followupDate)return;
    if(pendTasks(p).some(t=>t.tipo==='followup'&&t.data))return;
    const d=daysTo(p.followupDate);if(d<=0)hoje.push({kind:'fu',p,d});else if(d<=7)prox.push({kind:'fu',p,d});
  });
  S.prospeccao.filter(precisaCaso).forEach(p=>hoje.push({kind:'conv',p,d:0}));
  nfStore().forEach(n=>hoje.push({kind:'nf',n,d:0}));
  const key=o=>o.kind==='task'?(o.d!==null&&o.d<=0?o.d:0.5):o.d;
  hoje.sort((a,b)=>key(a)-key(b)||((a.t&&a.t.hora)||'99').localeCompare((b.t&&b.t.hora)||'99'));
  prox.sort((a,b)=>a.d-b.d||((a.t&&a.t.hora)||'99').localeCompare((b.t&&b.t.hora)||'99'));
  const atras=hoje.filter(o=>o.d!==null&&o.d<0).length;
  const semData=prov.filter(o=>o.d===null&&!o.t.foco).length;
  const aguard=S.prospeccao.filter(p=>p.stage==='aguardando_retorno').length;
  const elab=S.prospeccao.filter(p=>['examinar_docs','elaborar_proposta'].includes(p.stage)).length;
  return`<div class="dash">
  <div>
    <div class="blk">
      <div class="blk-h"><h2>⚖ Judicial</h2><span class="hint">prazos, julgamentos, audiências e despachos</span></div>
      ${judBlock()}
    </div>
    <div class="blk">
      <div class="blk-h"><h2>Hoje</h2><span class="n" style="background:${atras?'var(--red)':'var(--ink)'};color:#fff">${hoje.length}</span><span class="hint">${atras?atras+' em atraso · ':''}vence hoje, atrasado ou marcado com ★</span></div>
      ${hoje.length?`<div class="today-card">${hoje.map(dashRow).join('')}</div>`:`<div class="empty-ok">Nada vencendo hoje. Para puxar uma providência para cá, marque a ★ nela.</div>`}
    </div>
    <div class="blk">
      <details class="next7"><summary>▸ Próximos 7 dias <span class="pv-cnt">${prox.length}</span></summary>
        ${prox.length?prox.map(dashRow).join(''):`<div style="padding:14px;font-size:12px;color:var(--muted)">Nada agendado para os próximos 7 dias.</div>`}
      </details>
    </div>
  </div>
  <div>
    <div class="side-card"><h3>Resumo</h3>
      <div class="stat" onclick="S.provFilter='todas';navGo('prov','lista')"><span>Providências pendentes</span><b>${prov.length}</b></div>
      <div class="stat" onclick="S.provFilter='semdata';navGo('prov','lista')"><span>Sem data marcada</span><b>${semData}</b></div>
      <div class="stat" onclick="S.prospFilter='proposta';navGo('prospeccao','lista')"><span>Propostas a elaborar</span><b>${elab}</b></div>
      <div class="stat" onclick="S.prospFilter='proposta';navGo('prospeccao','lista')"><span>Propostas aguardando retorno</span><b>${aguard}</b></div>
      <div class="stat" onclick="navGo('casos','lista')"><span>Casos ativos</span><b>${ativosC().length}</b></div>
    </div>
    <div class="side-card"><h3>Monitoramento PJe</h3>
      ${PJE.map(l=>`<a class="stat" style="color:var(--blu)" href="${l.url}" target="_blank"><span>${l.label}</span><span>↗</span></a>`).join('')}
    </div>
  </div>
</div>`;
}

let _pvClosed={};
function clientOpts(sel){
  const c=ativosC().sort((a,b)=>a.client.localeCompare(b.client,'pt-BR')),p=ativosP().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  return`<option value="">Cliente…</option><optgroup label="Casos">${c.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.client)}</option>`).join('')}</optgroup><optgroup label="Prospecções">${p.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`;
}
function bProv(){
  const view=S.provView||'lista',f=S.provFilter||'todas';
  let items=provItems();
  if(S.provSearch){const q=S.provSearch.toLowerCase();items=items.filter(o=>o.t.texto.toLowerCase().includes(q)||itemName(o.c).toLowerCase().includes(q));}
  const all=items.length;
  if(f==='hoje')items=items.filter(isHoje);else if(f==='data')items=items.filter(o=>o.d!==null);else if(f==='semdata')items=items.filter(o=>o.d===null);
  const F=[['todas','Todas'],['hoje','★ Hoje e atrasadas'],['data','Com data'],['semdata','Sem data']];
  const bar=`<div class="top-bar">
    <div class="filters">${F.map(([id,l])=>`<button class="fbtn${f===id?' on':''}" onclick="S.provFilter='${id}';render()">${l}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;align-items:center">
      <input placeholder="Buscar providência ou cliente…" value="${esc(S.provSearch||'')}" onchange="S.provSearch=this.value;render()" style="padding:7px 11px;border:1px solid var(--line2);border-radius:var(--r);font-family:inherit;font-size:12px;width:220px">
      <div class="seg"><button class="${view==='lista'?'on':''}" onclick="S.provView='lista';render()">Por cliente</button><button class="${view==='quadro'?'on':''}" onclick="S.provView='quadro';render()">Quadro</button></div>
    </div></div>`;
  const add=`<div class="pv-add">
    <select id="pv-cli" style="max-width:220px">${clientOpts(S._pvLastCli||'')}</select>
    <input id="pv-txt" class="grow" placeholder="Nova providência: ligar para…, examinar…, elaborar…" onkeydown="if(event.key==='Enter')addProv()">
    <select id="pv-tipo" onchange="document.getElementById('pv-livre').style.display=this.value==='outro'?'':'none'">${tipoOpts('tarefa')}</select>
    <input id="pv-livre" placeholder="Qual?" style="display:none;width:120px">
    <input id="pv-data" type="date" title="Data (opcional)"><input id="pv-hora" type="time" title="Hora (opcional)" style="width:100px">
    <button class="btn btn-pri" onclick="addProv()">Adicionar</button></div>`;
  if(view==='quadro')return bar+add+provBoard(items);
  const groups={};items.forEach(o=>{(groups[o.c.id]=groups[o.c.id]||{c:o.c,isP:o.isP,list:[]}).list.push(o);});
  const gl=Object.values(groups).map(g=>{g.list.sort(provSort);g.k=provSortKey(g.list[0]);return g;}).sort((a,b)=>a.k-b.k||itemName(a.c).localeCompare(itemName(b.c),'pt-BR'));
  const tools=gl.length?`<div style="display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11.5px;color:var(--muted)"><span>${items.length} de ${all} providência${all!==1?'s':''} · ${gl.length} cliente${gl.length!==1?'s':''}</span><span><button class="alink" onclick="pvAll(false)">Expandir todos</button> · <button class="alink" onclick="pvAll(true)">Recolher todos</button></span></div>`:'';
  return bar+add+tools+(gl.length?gl.map(g=>{
    const closed=!!_pvClosed[g.c.id];const first=g.list[0];const w=whenOf(first.t,first.d);
    return`<div class="pv-group">
      <div class="pv-gh" onclick="pvToggle('${g.c.id}')">
        <span class="pv-caret">${closed?'▸':'▾'}</span>
        <span class="pv-name">${esc(itemName(g.c))}</span>
        ${g.isP?'<span class="chip" style="color:var(--car);background:var(--car-bg);border-color:var(--car-b)">prospecção</span>':''}
        <span class="pv-cnt">${g.list.length}</span>
        <span style="flex:1"></span>
        <span style="font-size:11.5px;font-weight:700;color:${w.col}">${w.txt}</span>
        <button class="alink" onclick="event.stopPropagation();${goItem(g.c)}">abrir ›</button>
      </div>
      ${closed?'':`<div class="pv-body">${g.list.map(o=>taskRow(o.c,o.t)).join('')}
        <div class="pv-gadd"><input placeholder="+ providência para ${esc(itemName(g.c))} (Enter)" onkeydown="if(event.key==='Enter'&&this.value.trim()){quickAdd('${g.c.id}',this.value)}"></div></div>`}

function autoStage(p,stage){
  const msgs=[];
  if(stage==='aguardando_docs'){if(addAuto(p,'docs','Cobrar documentos','followup',maisDias(5)))msgs.push('cobrar documentos em 5 dias');}
  else if(stage==='examinar_docs'){doneAuto(p,['docs']);if(addAuto(p,'exam','Examinar documentos','examinar'))msgs.push('examinar documentos');}
  else if(stage==='elaborar_proposta'){doneAuto(p,['docs','exam']);if(addAuto(p,'prop','Elaborar e enviar proposta','elab_doc'))msgs.push('elaborar e enviar proposta');}
  else if(stage==='aguardando_retorno'){doneAuto(p,['docs','exam','prop']);if(addAuto(p,'retorno','Cobrar retorno da proposta','followup',maisDias(7)))msgs.push('cobrar retorno em 7 dias');}
  else if(stage==='contratou'||stage==='nao_contratou'){doneAuto(p,['docs','exam','prop','retorno']);}
  return msgs;

function applyTaskLike(c,field,value){
  if(!c.tarefas)c.tarefas=[];if(!c.historico)c.historico=[];
  if(field==='tarefa'||field==='providência'||field==='providencia'){
    const parts=value.split('|').map(s=>s.trim());
    const texto=parts[0]||'';const tr=(parts[1]||'tarefa').trim();const trl=tr.toLowerCase();
    let tipo=TIPO_MAP_V2[trl];let livre='';if(!tipo){tipo='outro';livre=tr;}
    let data='',dataInicio='',dataFim='',hora=normHora(parts[3]||'');
    if(parts[2]){
      let p2=parts[2];const hm=p2.match(/\s(\d{1,2}\s*[:h]\s*\d{0,2})\s*$/i);if(hm&&!hora){hora=normHora(hm[1]);p2=p2.slice(0,hm.index);}
      const rng=p2.split(/\s+(?:a|até|-|→)\s+/);
      if(rng.length===2){const d1=parseDate(rng[0].trim()),d2=parseDate(rng[1].trim());if(tipo==='julg_virt'){data=d1;dataFim=d2;}else{dataInicio=d1;data=d2;}}
      else data=parseDate(p2.trim());
    }
    if(tipo!=='prazo')dataInicio='';if(tipo!=='julg_virt')dataFim='';
    if(texto)c.tarefas.push({id:uid(),texto,tipo,tipoLivre:livre,data,hora,dataInicio,dataFim,feito:false,dataFeito:''});
    return true;
  }
  if(field==='hoje'){const q=value.toLowerCase();const t=c.tarefas.find(x=>!x.feito&&x.texto.toLowerCase().includes(q));if(t)t.foco=true;return true;}
  if(field==='baixa'||field==='concluir'||field==='feito'){
    const q=value.toLowerCase();const t=c.tarefas.find(x=>!x.feito&&x.texto.toLowerCase().includes(q));
    if(t){t.feito=true;t.dataFeito=hojeISO();c.historico.unshift({id:uid(),data:t.dataFeito,texto:'✓ '+t.texto});}
    return true;
  }
  if(field==='historico'||field==='histórico'||field==='evolucao'||field==='evolução'){c.historico.unshift({id:uid(),data:hojeISO(),texto:value});return true;}
  return false;
}
